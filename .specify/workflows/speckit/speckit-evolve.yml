schema_version: "1.0"
workflow:
  id: "speckit-evolve"
  name: "Evolve Task with OpenEvolve"
  version: "1.0.0"
  author: "spec-kit skill"
  description: >
    Prepares OpenEvolve artifacts from spec-kit artifacts for a single task,
    gates for manual OpenEvolve run, then integrates the best result back into
    the codebase and verifies the test suite.

requires:
  speckit_version: ">=0.7.2"
  integrations:
    any: ["claude", "copilot", "gemini"]

inputs:
  task_id:
    type: string
    required: true
    prompt: "Task ID to evolve (e.g. T-14)"
  integration:
    type: string
    default: "claude"
  iterations:
    type: number
    default: 200
    prompt: "Number of evolution iterations"
  llm_model:
    type: string
    default: "claude-sonnet-4-6"
    prompt: "LLM model for OpenEvolve (via LiteLLM proxy)"

steps:

  # ── Step 1: Generate OpenEvolve artifacts ─────────────────────
  - id: prepare
    command: speckit.evolve
    integration: "{{ inputs.integration }}"
    input:
      args: "mode:prepare task_id:{{ inputs.task_id }} iterations:{{ inputs.iterations }} llm_model:{{ inputs.llm_model }}"

  # ── Step 2: Verify evaluator runs against baseline ────────────
  - id: verify-evaluator
    type: shell
    run: "python .specify/specs/*/evolve/{{ inputs.task_id }}/evaluator.py .specify/specs/*/evolve/{{ inputs.task_id }}/initial_program.py 2>&1 | tail -5"

  # ── Gate: Review artifacts before running evolution ───────────
  - id: gate-review-artifacts
    type: gate
    message: |
      OpenEvolve artifacts generated. Review before starting evolution.

      → .specify/specs/*/evolve/{{ inputs.task_id }}/initial_program.py
      → .specify/specs/*/evolve/{{ inputs.task_id }}/evaluator.py
      → .specify/specs/*/evolve/{{ inputs.task_id }}/config.yaml

      Baseline evaluator output shown above.

      To start evolution, run in a separate terminal:
        python openevolve-run.py \
          .specify/specs/*/evolve/{{ inputs.task_id }}/initial_program.py \
          .specify/specs/*/evolve/{{ inputs.task_id }}/evaluator.py \
          --config .specify/specs/*/evolve/{{ inputs.task_id }}/config.yaml \
          --iterations {{ inputs.iterations }}

      Approve when OpenEvolve has finished running.
    options: [approve, reject]
    on_reject: abort

  # ── Step 3: Integrate best evolved program ────────────────────
  - id: integrate
    command: speckit.evolve
    integration: "{{ inputs.integration }}"
    input:
      args: "mode:integrate task_id:{{ inputs.task_id }} evolve_output_dir:.specify/specs/*/evolve/{{ inputs.task_id }}/openevolve_output"

  # ── Step 4: Run test suite to confirm no regressions ─────────
  - id: verify-tests
    type: shell
    run: "npm test 2>&1 | tail -5 || pytest --tb=short 2>&1 | tail -10"

  # ── Gate: Review test results ─────────────────────────────────
  - id: gate-tests
    type: gate
    message: |
      Test suite complete. Review results above.

      If tests failed after integrating evolved code, reject to abort
      and fix the integration manually, then re-run this workflow.
    options: [approve, reject]
    on_reject: abort
